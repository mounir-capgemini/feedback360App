server:
  port: 8080

spring:
  application:
    name: feedback360

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feedback360}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp-mail.outlook.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:feedback360.app@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            protocol: TLSv1.2
        debug: false

# JWT Configuration
jwt:
  secret: Feedback360SecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024SecureKey
  expiration: 86400000  # 24 heures en millisecondes

# Frontend URL for email links
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
# Test profile – uses H2 in-memory so tests need no running PostgreSQL
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:feedback360test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false